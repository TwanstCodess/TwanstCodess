name: GitHub stats card

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main, master]
    paths-ignore:
      - "assets/github-stats.svg"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools brotli uharfbuzz

      - name: Build stats card
        run: python _source/github_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || (git commit -m "Update GitHub stats card" && git push)
